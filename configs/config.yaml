# Versioned runtime and evaluation configuration for invoiceops-agent.
# Every evaluation run logs `config_version` and git SHA for reproducibility.
# Model IDs and token prices verified against https://aistudio.google.com/docs/models
# and https://aistudio.google.com/docs/pricing on 2026-11-17.

config_version: "p1.0.0"
project_name: "invoiceops-agent"

platform:
  mode: "local_ai_studio"
  gcp_project_id: null
  region: "us-central1"
  use_enterprise_agent_platform: false

budget_guardrails:
  p1_p3_budget_usd: 0.0
  enforce_free_tier_models_only: true
  max_single_eval_estimated_usd: 2.0
  p4_monthly_budget_usd: 10.0
  p4_budget_alert_thresholds_percent:
    - 50
    - 80
    - 100

models:
  # Live-probed Free-Tier high-throughput defaults (see ADR-002 & FL-004/FL-005:
  # gemini-4-hydrogen & gemini-3.8-flash return HTTP 503 under peak Free-Tier load, and
  # gemini-3-flash-preview enforces a 5 RPM Free-Tier cap, whereas gemini-3.5-flash-lite
  # and gemini-3.1-flash-lite serve reliably at high throughput).
  v0_baseline: "gemini-3.5-flash-lite"
  orchestrator: "gemini-3.5-flash-lite"
  extraction: "gemini-3.5-flash-lite"
  policy_rag: "gemini-3.5-flash-lite"
  critic: "gemini-3.5-flash-lite"
  fast_router: "gemini-3.1-flash-lite"
  llm_judge: "gemini-3.5-flash-lite"
  embedding: "gemini-embedding-2"
  embedding_text_fallback: "gemini-embedding-001"
  paid_frontier_reference: "gemini-4-argon"
  fallback_chain:
    - "gemini-3.1-flash-lite"
    - "gemini-3-flash-preview"

  generation_defaults:
    temperature: 0.0
    max_output_tokens: 4096

  pricing_usd_per_1m_tokens:
    gemini-4-hydrogen:
      free_tier_eligible: true
      input: 1.50
      output: 7.50
      cached_input: 0.075
    gemini-3.8-flash:
      free_tier_eligible: true
      input: 0.75
      output: 3.75
      cached_input: 0.075
    gemini-3-flash-preview:
      free_tier_eligible: true
      input: 0.50
      output: 3.00
      cached_input: 0.05
    gemini-3.5-flash-lite:
      free_tier_eligible: true
      input: 0.30
      output: 2.50
      cached_input: 0.03
    gemini-3.1-flash-lite:
      free_tier_eligible: true
      input: 0.25
      output: 1.50
      cached_input: 0.025
    gemini-embedding-2:
      free_tier_eligible: true
      input: 0.20
      output: 0.0
      cached_input: 0.0
    gemini-embedding-001:
      free_tier_eligible: true
      input: 0.15
      output: 0.0
      cached_input: 0.0
    gemini-4-argon:
      free_tier_eligible: false
      input: 2.00
      output: 10.00
      cached_input: 0.10
    gemini-4-carbon:
      free_tier_eligible: false
      input: 2.00
      output: 10.00
      cached_input: 0.10

matching_and_hitl:
  price_variance_tolerance_pct: 0.02
  price_reject_threshold_pct: 0.10
  quantity_variance_tolerance_pct: 0.0
  tax_rate_tolerance_abs: 0.005
  late_submission_max_days: 60
  spot_buy_no_po_limit_usd: 500.0
  human_approval_amount_threshold_usd: 10000.0
  human_approval_min_confidence: 0.80
  max_extraction_schema_retries: 2
  max_critic_sendbacks: 1

storage:
  backend: "local_sqlite"
  local_sqlite_path: "data/generated/invoiceops_local.sqlite3"
  local_eval_runs_jsonl: "results/eval_runs.jsonl"
  bigquery_dataset: "invoiceops"
  bigquery_policy_table: "policy_clauses"
  bigquery_eval_runs_table: "eval_runs"
  top_k_clauses: 5
  naive_chunk_chars: 420
  naive_chunk_overlap_chars: 60

mock_erp:
  topology: "streamable_http_mcp"
  base_url: "http://127.0.0.1:8001/mcp"
  require_cloud_run_iam_auth: false
  flaky_mode: false
  flaky_timeout_rate: 0.12
  flaky_rate_limit_429_rate: 0.15
  flaky_stale_read_rate: 0.10
  client_timeout_seconds: 5.0
  max_retries: 3
  circuit_breaker_failure_threshold: 5
  circuit_breaker_recovery_seconds: 30.0

evaluation:
  random_seed: 42
  dev_split_ratio: 0.60
  test_split_ratio: 0.40
  runs_per_experiment: 3
  default_dev_subset: "golden_12"
  max_concurrency: 1
  inter_case_delay_seconds: 2.0
  judge_min_kappa_threshold: 0.65
  error_cost_weights:
    false_approval: 10.0
    false_rejection: 3.0
    false_hold: 2.0
    false_escalation: 1.0
