[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceops-agent"
version = "0.1.0"
description = "Measured multi-agent accounts-payable exception resolution system on Google Cloud (ADK + MCP + Hybrid RAG + BigQuery VECTOR_SEARCH)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Abhigyan" }]
dependencies = [
    "google-adk[mcp,otel]>=2.14.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pillow>=10.4.0,<12.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "reportlab>=4.2.0,<5.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
]
gcp = [
    "google-adk[gcp]>=2.14.0,<3.0.0",
    "google-cloud-secret-manager>=2.21.0,<3.0.0",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
]
eval = [
    "google-adk[eval]>=2.14.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["invoiceops"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
